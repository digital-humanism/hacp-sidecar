services:
  upstream:
    build:
      context: .
      dockerfile: Dockerfile.upstream
    ports:
      - "8000:8000"
    networks:
      - hacp-net

  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.control
    ports:
      - "5000:5000"
    networks:
      - hacp-net

  sidecar:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.sidecar
    environment:
      HACP_SIDECAR_PORT: "8080"
      HACP_PROVENANCE_FLUSH_PATH: "/var/log/hacp/provenance.jsonl"
      HACP_UPSTREAM: "http://upstream:8000"
    ports:
      - "8080:8080"
    depends_on:
      - upstream
      - control-plane
    networks:
      - hacp-net
    volumes:
      - provenance-data:/var/log/hacp

  agent:
    image: alpine:latest
    command: ["sh", "-c", "apk add --no-cache curl && tail -f /dev/null"]
    depends_on:
      - sidecar
    networks:
      - hacp-net

networks:
  hacp-net:
    driver: bridge

volumes:
  provenance-data: