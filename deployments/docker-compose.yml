services:
  upstream:
    build:
      context: .
      dockerfile: Dockerfile.upstream
    networks:
      - protected-net

  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.control
    ports:
      - "5000:5000"
    networks:
      - control-net

  sidecar:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.sidecar
    environment:
      HACP_SIDECAR_PORT: "8080"
      HACP_PROVENANCE_FLUSH_PATH: "/var/log/hacp/provenance.jsonl"
      HACP_UPSTREAM: "http://upstream:8000"

      # This Compose file is an integration deployment.
      # Production deployments must use explicit production trust configuration.
      HACP_TRUST_MODE: "test"
    ports:
      - "8080:8080"
    depends_on:
      - upstream
      - control-plane
    networks:
      - untrusted-net
      - protected-net
      - control-net
    volumes:
      - provenance-data:/var/log/hacp

  agent:
    image: alpine:latest
    command: ["sh", "-c", "apk add --no-cache curl && tail -f /dev/null"]
    depends_on:
      - sidecar
    networks:
      - untrusted-net

networks:
  untrusted-net:
    driver: bridge

  protected-net:
    driver: bridge
    internal: true

  control-net:
    driver: bridge

volumes:
  provenance-data: