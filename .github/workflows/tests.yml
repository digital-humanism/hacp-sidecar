name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate-e:
    name: Gate E distributed control plane
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hacp-sidecar
        uses: actions/checkout@v5
        with:
          path: hacp-sidecar

      - name: Checkout hacp-spec
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/hacp-spec
          path: hacp-spec

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: hacp-sidecar/go.mod
          cache-dependency-path: hacp-sidecar/go.sum

      - name: Download dependencies
        working-directory: hacp-sidecar
        run: go mod download

      - name: Gate E integration tests
        working-directory: hacp-sidecar
        run: go test ./internal/controlplane -count=1 -v

      - name: Full regression
        working-directory: hacp-sidecar
        run: go test ./... -count=1

  anti-bypass:
    name: PH-1B anti-bypass deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hacp-sidecar
        uses: actions/checkout@v5
        with:
          path: hacp-sidecar

      - name: Verify Docker Compose
        run: docker compose version

      - name: Run anti-bypass deployment tests
        working-directory: hacp-sidecar
        run: sh ./scripts/test-anti-bypass.sh

      - name: Show deployment state on failure
        if: failure()
        working-directory: hacp-sidecar
        run: |
          docker compose -f deployments/docker-compose.yml ps
          docker compose -f deployments/docker-compose.yml logs --no-color

      - name: Clean up deployment
        if: always()
        working-directory: hacp-sidecar
        run: docker compose -f deployments/docker-compose.yml down -v